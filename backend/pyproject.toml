[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-compiler"
version = "0.1.0"
description = "API y motor de análisis de un lenguaje de horarios universitarios"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    "lark==1.3.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx2==2.16.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"schedule_compiler.compiler" = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
